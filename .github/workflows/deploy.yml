name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

# O deploy do GitHub Pages precisa de pages:write e do token OIDC (id-token).
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; um push novo espera o anterior terminar em vez de cortá-lo no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # typecheck + lint + test + build (com o índice da busca). Se algo falha, nada é
      # publicado e o site continua na versão anterior.
      - run: bun run verify
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
